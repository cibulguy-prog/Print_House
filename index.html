const docs=()=>all('docs');
function docNet(d){if(d.type==='400')return 0;return r2((d.lines||[]).reduce((s,l)=>s+(+l.qty||0)*(+l.price||0),0)-(+d.discount||0))}
function docVat(d){return d.type==='400'?0:r2(docNet(d)*(d.vatRate??ST().vatRate)/100)}
function docTotal(d){if(d.type==='400')return r2((d.payments||[]).reduce((s,p)=>s+(+p.amount||0),0));return r2(docNet(d)+docVat(d))}
function invPaid(inv){
  if(inv.type==='320')return docTotal(inv);
  let p=0;docs().forEach(d=>{if(d.type==='400')(d.appliesTo||[]).forEach(a=>{if(a.id===inv.id)p+=+a.amount||0});if(d.type==='330'&&d.refDocId===inv.id)p+=docTotal(d)});return r2(p)}
const invOpen=inv=>r2(docTotal(inv)-invPaid(inv));
function custBalance(cid){let b=0;docs().forEach(d=>{if(d.customerId!==cid)return;if(d.type==='305')b+=docTotal(d);if(d.type==='330')b-=docTotal(d);if(d.type==='400')b-=docTotal(d)});return r2(b)}
const openInvoices=()=>docs().filter(d=>d.type==='305'&&invOpen(d)>0.009);
const invDue=d=>d.dueDate||d.date;
function nextNumber(type){const start=+ST().numbering[type]||1;let mx=start-1;docs().forEach(d=>{if(d.type===type&&+d.number>mx)mx=+d.number});return mx+1}
function expCalc(e){const rate=(e.vatRate??ST().vatRate)/100;const tot=+e.total||0;const net=e.hasVat?r2(tot/(1+rate)):tot;const vat=r2(tot-net);const rec=r2(vat*catFrac(e.category));return{net,vat,rec,cost:r2(tot-rec)}}
const inRange=(d,a,b)=>d>=a&&d<=b;
function income(a,b){let net=0,vat=0;docs().forEach(d=>{if(!inRange(d.date,a,b))return;if(d.type==='305'||d.type==='320'){net+=docNet(d);vat+=docVat(d)}if(d.type==='330'){net-=docNet(d);vat-=docVat(d)}});return{net:r2(net),vat:r2(vat)}}
function expenses(a,b){const by={};let cost=0,recA=0,recO=0,tot=0;all('expenses').forEach(e=>{if(!inRange(e.date,a,b))return;const c=expCalc(e);by[e.category]=(by[e.category]||0)+c.net+(c.vat-c.rec);cost+=c.cost;tot+=+e.total||0;if(e.isAsset)recA+=c.rec;else recO+=c.rec});return{by,cost:r2(cost),recA:r2(recA),recO:r2(recO),tot:r2(tot)}}
function cashIn(a,b){let s=0;docs().forEach(d=>{if((d.type==='400'||d.type==='320')&&inRange(d.date,a,b))s+=docTotal(d)});return r2(s)}
function cashOut(a,b){let s=0;all('expenses').forEach(e=>{if(e.paid&&inRange(e.paidDate||e.date,a,b))s+=+e.total||0});return r2(s)}
function monthRange(y,m){return[isoD(new Date(y,m,1)),isoD(new Date(y,m+1,0))]}
function vatPeriodOf(dateStr){const d=parseD(dateStr);const y=d.getFullYear(),m=d.getMonth();if(ST().vatPeriod==='mon')return{y,from:m,to:m};const s=m-(m%2);return{y,from:s,to:s+1}}
function periodLabel(p){return p.from===p.to?MONTHS[p.from]+' '+p.y:MONTHS[p.from]+'–'+MONTHS[p.to]+' '+p.y}

function chart12(){
  const now=new Date();const pts=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const [a,b]=monthRange(d.getFullYear(),d.getMonth());const inc=income(a,b).net,ex=expenses(a,b).cost;pts.push({l:MSHORT[d.getMonth()],y:d.getFullYear(),inc,ex,p:inc-ex})}
  const W=760,H=250,L=8,R=58,T=12,B=28;const max=Math.max(1000,...pts.map(p=>Math.max(p.inc,p.ex)));const min=Math.min(0,...pts.map(p=>p.p));
  const step=niceStep((max-min)/4);const top=Math.ceil(max/step)*step,bot=Math.floor(min/step)*step;
  const y=v=>T+(top-v)/(top-bot)*(H-T-B);const cw=(W-L-R)/12;
  // RTL: first (oldest) month on the right
  const x=i=>W-R-(i+1)*cw;
  let g='';for(let v=bot;v<=top+1e-6;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.2:.6}"/><text x="${W-R+6}" y="${y(v)+4}" text-anchor="start">${v>=1000||v<=-1000?NN.format(Math.round(v/1000))+'K':NN.format(v)}</text>`}
  let bars='',line='',dots='';const bw=Math.min(16,cw/3.2);
  pts.forEach((p,i)=>{const cx=x(i)+cw/2;
    bars+=`<rect x="${cx+1}" y="${y(Math.max(0,p.inc))}" width="${bw}" height="${Math.abs(y(0)-y(p.inc))}" rx="2" fill="var(--cyan)"><title>${p.l} ${p.y}: הכנסות ${fmt0(p.inc)}</title></rect>`;
    bars+=`<rect x="${cx-1-bw}" y="${y(Math.max(0,p.ex))}" width="${bw}" height="${Math.abs(y(0)-y(p.ex))}" rx="2" fill="var(--magenta)"><title>${p.l} ${p.y}: הוצאות ${fmt0(p.ex)}</title></rect>`;
    line+=(i?'L':'M')+cx+','+y(p.p);
    dots+=`<circle cx="${cx}" cy="${y(p.p)}" r="${i===11?4:2.5}" fill="var(--ink)"><title>${p.l} ${p.y}: רווח ${fmt0(p.p)}</title></circle>`;
    bars+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${p.l}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף הכנסות והוצאות חודשיות">${g}${bars}<path d="${line}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>${dots}</svg>`;
}
function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(Math.max(v,1))));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}

function readQ(){const g=id=>$('#'+id);if(!g('qf'))return;
  const ns=g('q_size').value;if(ns!==Q.size){Q.size=ns;const z=SIZES.find(z=>z[0]===ns);if(z[2]){Q.w=z[2];Q.h=z[3];g('q_w').value=Q.w;g('q_h').value=Q.h}}
  else{Q.w=+g('q_w').value||0;Q.h=+g('q_h').value||0;const m=SIZES.find(z=>z[2]===Q.w&&z[3]===Q.h);if(!m&&Q.size!=='custom'){Q.size='custom';g('q_size').value='custom'}}
  Q.qty=Math.max(1,+g('q_qty').value||1);Q.pages=Math.max(1,+g('q_pages').value||1);Q.color=g('q_color').value;Q.paper=g('q_paper').value;
  Q.fin={};$$('[data-fin]').forEach(c=>{if(c.checked)Q.fin[c.dataset.fin]=1});
  Q.design=+g('q_design').value||0;Q.outsrc=+g('q_out').value||0;Q.markup=+g('q_markup').value;Q.round=g('q_round').checked;Q.customerId=g('q_cust').value;Q.title=g('q_title').value;
}
function computeQ(){
  const s=ST(),sh=s.sheet;const uw=sh.w-2*sh.margin,uh=sh.h-2*sh.margin,b=2*sh.bleed;
  const w=Q.w+b,h=Q.h+b;const up=Math.max(Math.floor(uw/w)*Math.floor(uh/h),Math.floor(uw/h)*Math.floor(uh/w));
  const col=COLORS.find(c=>c[0]===Q.color)||COLORS[0];const duplex=(col[2]+col[3])>1;
  const pieces=Q.pages<=2?1:Math.ceil(Q.pages/(duplex?2:1));
  const net=up?Math.ceil(Q.qty*pieces/up):0;const waste=Math.ceil(net*s.waste/100)+(+s.setupSheets||0);const sheets=net+waste;
  const paper=(s.papers.find(p=>p.id===Q.paper)||s.papers[0]||{price:0,name:''});
  const paperCost=r2(sheets*paper.price);const printCost=r2(sheets*(col[2]*s.clicks.color+col[3]*s.clicks.bw));
  const fins=s.finishings.filter(f=>Q.fin[f.id]).map(f=>{const base=f.unit==='sheet'?sheets*f.price:f.unit==='unit'?Q.qty*f.price:f.price;return{name:f.name,cost:r2(base+(+f.setup||0))}});
  const finCost=r2(fins.reduce((a,f)=>a+f.cost,0));
  const cost=r2(paperCost+printCost+finCost+Q.outsrc);
  const mk=isFinite(Q.markup)?Q.markup:s.markup;
  let price=Math.max(+s.minPrice||0,cost*(1+mk/100));price+=Q.design;
  if(Q.round&&s.roundTo>0)price=Math.ceil(price/s.roundTo)*s.roundTo;price=r2(price);
  const vat=r2(price*s.vatRate/100);
  const title=Q.title.trim()||`${NN.format(Q.qty)} × ${(SIZES.find(z=>z[0]===Q.size)||[])[1]&&Q.size!=='custom'?SIZES.find(z=>z[0]===Q.size)[1]:Q.w+'×'+Q.h+' מ״מ'}${Q.pages>1?', '+Q.pages+' עמ׳':''}`;
  const specs=[paper.name,col[0]+' '+col[1],...fins.map(f=>f.name)].join(' · ');
  return{up,pieces,net,waste,sheets,paper,paperCost,printCost,fins,finCost,cost,price,vat,total:r2(price+vat),unit:r2(price/Q.qty),profit:r2(price-cost),title,specs,mk};
}
function renderQ(){const r=computeQ();const el=$('#qres');if(!el)return;

function docCustChanged(first){

  const ap=$('#df_apply');if(ap){const inv=cid?openInvoices().filter(d=>d.customerId===cid).sort((a,b)=>a.date.localeCompare(b.date)):[];const pre=DF.preset.invId;

    if(pre){const cb=ap.querySelector(`[data-ap="${CSS.escape(pre)}"]`);if(cb){cb.checked=true;const d=S.docs[pre];ap.querySelector(`[data-apa="${CSS.escape(pre)}"]`).value=invOpen(d);const pa=$('#df_pays .pa');if(pa&&!pa.value)pa.value=invOpen(d)}}}
}
function readLines(){return $$('#df_lines tr').map(tr=>({desc:tr.querySelector('.ld').value.trim(),qty:+tr.querySelector('.lq').value||0,price:r2(tr.querySelector('.lp').value)})).filter(l=>l.desc||l.price)}
function readPays(){return $$('#df_pays tr').map(tr=>({method:tr.querySelector('.pm').value,amount:r2(tr.querySelector('.pa').value),date:tr.querySelector('.pdt').value,ref:tr.querySelector('.pr').value.trim()})).filter(p=>p.amount)}
function docRecalc(){if(!DF||!$('#docF'))return;const s=ST();
  $$('#df_lines tr').forEach(tr=>{tr.querySelector('.lt').textContent=fmt((+tr.querySelector('.lq').value||0)*(+tr.querySelector('.lp').value||0))});

    $('#df_tot').innerHTML=`<div class="row"><span>סה״כ לפני מע״מ</span><span class="num">${fmt(net)}</span></div><div class="row"><span>מע״מ ${s.vatRate}%</span><span class="num">${fmt(vat)}</span></div><div class="row tot"><span>סה״כ לתשלום</span><span class="num">${fmt(total)}</span></div>`;
    const c=S.customers[$('#df_c').value]||{};const al=$('#df_alloc');
    if(al)al.innerHTML=(DF.type==='305'||DF.type==='320')&&net>=s.allocThreshold?`<div class="warnbox">חשבונית מעל ${fmt0(s.allocThreshold)} לפני מע״מ ${c.taxId?'ללקוח עוסק':''} מחייבת מספר הקצאה מרשות המסים כדי שהלקוח יוכל לקזז את המע״מ.</div><label class="f" style="margin-top:8px">מספר הקצאה<input id="df_allocno" value="${esc(($('#df_allocno')||{}).value||'')}" inputmode="numeric" placeholder="9 ספרות"></label>`:''}
  const ps=$('#df_paysum');if(ps){const p=r2(readPays().reduce((a,x)=>a+x.amount,0));ps.textContent=DF.type==='320'?(Math.abs(p-total)<0.01?'התקבולים תואמים לסכום החשבונית':'סה״כ תקבולים '+fmt(p)+' · סכום החשבונית '+fmt(total)):'סה״כ התקבול: '+fmt(p)}
}
function submitDoc(){const s=ST(),type=DF.type,cid=$('#df_c').value;if(!cid){toast('בחר לקוח');return}
  const c=S.customers[cid];const d={id:uid(),type,number:0,date:$('#df_d').value||today(),customerId:cid,customerName:c.name,customerTaxId:c.taxId||'',customerAddress:c.address||'',vatRate:s.vatRate,notes:$('#df_notes').value.trim(),createdAt:new Date().toISOString()};
  if(type!=='400'){d.lines=readLines();d.discount=r2(($('#df_disc')||{}).value);if(!d.lines.length){toast('הוסף לפחות שורת פריט אחת');return}if($('#df_allocno'))d.allocation=$('#df_allocno').value.trim()}
  if(type==='305')d.dueDate=$('#df_due').value||d.date;
  if(type==='330'){d.refDocId=$('#df_ref').value||''}
  if(DT[type].rec){d.payments=readPays();if(!d.payments.length){toast('הזן לפחות תקבול אחד');return}
    if(type==='320'&&Math.abs(d.payments.reduce((a,p)=>a+p.amount,0)-docTotal(d))>0.01){toast('סכום התקבולים חייב להיות שווה לסכום החשבונית');return}}
  if(type==='400'){d.appliesTo=$$('[data-ap]').filter(x=>x.checked).map(x=>({id:x.dataset.ap,amount:r2($(`[data-apa="${CSS.escape(x.dataset.ap)}"]`).value)})).filter(a=>a.amount>0);
    const tot=docTotal(d),ap=r2(d.appliesTo.reduce((a,x)=>a+x.amount,0));if(ap>tot+0.01){toast('הסכום המשויך גדול מסכום הקבלה');return}}
  const jobIds=$$('[data-job]').filter(x=>x.checked).map(x=>x.dataset.job);if(jobIds.length)d.jobIds=jobIds;
  const btn=$('#docF .btn.pri');btn.disabled=true;btn.textContent='מפיק…';
  call('createDoc',serialize('docs',d),clone(s.numbering)).then(saved=>{d.number=saved.number;S.docs[d.id]=d;
    jobIds.forEach(id=>{const j=S.jobs[id];if(j)put('jobs',Object.assign({},j,{status:'billed',invoiceId:d.id}))});
    closeModal();toast(DT[type].name+' '+d.number+' הופקה');DF=null;schedule();setTimeout(()=>viewDoc(d.id),50)})
   .catch(e=>{btn.disabled=false;btn.textContent='נסה שוב';toast('ההפקה נכשלה: '+(e&&e.message||''))});
}

  </div>
  <div style="margin:14px 0"><b>לכבוד:</b> ${esc(d.customerName)}${d.customerTaxId?' · ח.פ/ע.מ '+esc(d.customerTaxId):''}${d.customerAddress?'<br>'+esc(d.customerAddress):''}</div>
  ${ref?`<div style="margin-bottom:10px">בהתייחס ל${DT[ref.type].name} מס׳ ${esc(ref.number)} מיום ${dfmt(ref.date)}</div>`:''}
  ${d.type!=='400'?`<table style="width:100%;border-collapse:collapse;margin:8px 0"><thead><tr style="background:#EDF1F4"><th style="text-align:right;padding:6px">תיאור</th><th style="padding:6px;text-align:left">כמות</th><th style="padding:6px;text-align:left">מחיר ליח׳</th><th style="padding:6px;text-align:left">סה״כ</th></tr></thead><tbody>${(d.lines||[]).map(l=>`<tr><td style="padding:6px;border-bottom:1px solid #D7DDE4">${esc(l.desc)}</td><td style="padding:6px;border-bottom:1px solid #D7DDE4;text-align:left">${NN.format(l.qty)}</td><td style="padding:6px;border-bottom:1px solid #D7DDE4;text-align:left">${fmt(l.price)}</td><td style="padding:6px;border-bottom:1px solid #D7DDE4;text-align:left">${fmt(l.qty*l.price)}</td></tr>`).join('')}</tbody></table>

 <div class="tools"><select id="ef_m" style="width:auto"><option value="">כל החודשים</option>${ms.map(m=>`<option value="${m[0]}" ${F.expenses.m===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select><select id="ef_c" style="width:auto"><option value="">כל הקטגוריות</option>${CATS.map(c=>`<option value="${c[0]}" ${F.expenses.cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select><label class="chk"><input type="checkbox" id="ef_u" ${F.expenses.unpaid?'checked':''}> רק שלא שולמו</label><input class="search" id="eq" type="search" placeholder="חיפוש ספק או תיאור" value="${esc(F.expenses.q)}"></div><div id="vb"></div>`};

  return `${sampleBanner()}<div class="tbl"><table><thead><tr><th>תאריך</th><th>ספק</th><th>תיאור</th><th>קטגוריה</th><th class="n">לפני מע״מ</th><th class="n">מע״מ לקיזוז</th><th class="n">סה״כ</th><th>תשלום</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">אין הוצאות להצגה</td></tr>'}</tbody>${list.length?`<tfoot><tr><td colspan="4">${list.length} הוצאות</td><td class="n">${fmt(N)}</td><td class="n">${fmt(R)}</td><td class="n">${fmt(T)}</td><td colspan="2"></td></tr></tfoot>`:''}</table></div>`};

function defaultPeriod(){const p=vatPeriodOf(today());return{kind:ST().vatPeriod==='mon'?'mon':'bi',y:p.y,i:p.from}}
function periodRange(P){if(P.kind==='year')return{a:P.y+'-01-01',b:P.y+'-12-31',label:'שנת '+P.y};let f=P.i,t=P.i;if(P.kind==='bi'){f=P.i-(P.i%2);t=f+1}if(P.kind==='q'){f=P.i-(P.i%3);t=f+2}return{a:monthRange(P.y,f)[0],b:monthRange(P.y,t)[1],label:periodLabel({y:P.y,from:f,to:t})}}
SHELL.reports=()=>{if(!F.reports)F.reports=defaultPeriod();const P=F.reports;const yrs=[];const cy=new Date().getFullYear();for(let y=cy;y>=cy-4;y--)yrs.push(y);
  let idx='';if(P.kind==='mon')idx=MONTHS.map((m,i)=>`<option value="${i}" ${i===P.i?'selected':''}>${m}</option>`).join('');if(P.kind==='bi')idx=[0,2,4,6,8,10].map(i=>`<option value="${i}" ${i===P.i-(P.i%2)?'selected':''}>${MONTHS[i]}–${MONTHS[i+1]}</option>`).join('');if(P.kind==='q')idx=[0,3,6,9].map((i,k)=>`<option value="${i}" ${i===P.i-(P.i%3)?'selected':''}>רבעון ${k+1}</option>`).join('');
  return `${head('דוחות ומע״מ','רווח והפסד, דוח מע״מ, מקדמות מס הכנסה, תזרים וגיול חובות',`<button class="btn" data-act="csvAll">כל המסמכים ללשונית דוח</button>`)}
  <div class="tools"><div class="seg">${[['mon','חודש'],['bi','דו־חודשי'],['q','רבעון'],['year','שנה']].map(([k,n])=>`<button data-act="rkind" data-v="${k}" aria-pressed="${P.kind===k}">${n}</button>`).join('')}</div><select id="r_y" style="width:auto">${yrs.map(y=>`<option ${y===P.y?'selected':''}>${y}</option>`).join('')}</select>${idx?`<select id="r_i" style="width:auto">${idx}</select>`:''}</div><div id="vb"></div>`};
BODY.reports=()=>{const P=F.reports;const R=periodRange(P);const s=ST();const inc=income(R.a,R.b),ex=expenses(R.a,R.b);const profit=r2(inc.net-ex.cost);
  const vatOut=inc.vat,vatIn=r2(ex.recA+ex.recO),vatNet=r2(vatOut-vatIn);const adv=r2(inc.net*s.advanceRate/100);
  const cats=Object.entries(ex.by).sort((a,b)=>b[1]-a[1]);
  // cashflow by month in year
  const cf=[];let cum=0;for(let m=0;m<12;m++){const[a,b]=monthRange(P.y,m);const i=cashIn(a,b),o=cashOut(a,b);cum+=i-o;cf.push({m,i,o,n:i-o,c:cum})}
  // aging
  const buckets=[0,0,0,0,0];const ag={};openInvoices().forEach(d=>{const late=daysBetween(invDue(d),today());const k=late<=0?0:late<=30?1:late<=60?2:late<=90?3:4;const o=invOpen(d);buckets[k]+=o;const n=d.customerName||custName(d.customerId);ag[n]=ag[n]||[0,0,0,0,0];ag[n][k]+=o});
  const BL=['טרם הגיע מועד','1–30 ימים','31–60','61–90','מעל 90'];
  return `<div class="cols">
  <div class="panel"><div class="ph"><h2>רווח והפסד · ${esc(R.label)}</h2><button class="btn sm" data-act="csvPL">CSV</button></div>
   <div class="rows"><div class="row"><span>הכנסות ממכירות (נטו)</span><b class="num">${fmt(inc.net)}</b></div>
   ${cats.map(([k,v])=>`<div class="row small"><span class="muted">${esc(catName(k))}</span><span class="num">${fmt(-v)}</span></div>`).join('')||'<div class="row small muted"><span>אין הוצאות בתקופה</span></div>'}
   <div class="row"><span>סה״כ הוצאות</span><b class="num">${fmt(-ex.cost)}</b></div>
   <div class="row tot"><span>${profit>=0?'רווח':'הפסד'} לתקופה</span><span class="num" style="color:${profit<0?'var(--bad)':'inherit'}">${fmt(profit)}</span></div>
   <div class="row small muted"><span>שיעור רווח</span><span class="num">${inc.net?Math.round(profit/inc.net*100)+'%':'—'}</span></div></div>
   <p class="note">ההוצאות כוללות רכישת ציוד במלואה. פחת לצורכי מס מחושב אצל רואה החשבון.</p></div>
  <div class="panel"><div class="ph"><h2>דוח מע״מ · ${esc(R.label)}</h2><button class="btn sm" data-act="csvVAT">CSV</button></div>
   <div class="rows"><div class="row"><span>עסקאות חייבות (לפני מע״מ)</span><span class="num">${fmt(inc.net)}</span></div><div class="row"><span>מע״מ עסקאות</span><b class="num">${fmt(vatOut)}</b></div>
   <div class="row"><span>מע״מ תשומות ציוד</span><span class="num">${fmt(ex.recA)}</span></div><div class="row"><span>מע״מ תשומות אחרות</span><span class="num">${fmt(ex.recO)}</span></div>
   <div class="row tot"><span>${vatNet>=0?'מע״מ לתשלום':'מע״מ להחזר'}</span><span class="num">${fmt(Math.abs(vatNet))}</span></div></div>
   <p class="note">דיווח ${s.vatPeriod==='mon'?'חודשי':'דו־חודשי'} עד ה־15 בחודש שאחרי התקופה (ה־19 בדיווח מקוון). ודא שהתקופה שבחרת תואמת את תקופת הדיווח שלך.</p>
   <h3 style="margin:14px 0 6px">מקדמות מס הכנסה</h3><div class="rows"><div class="row"><span>מחזור לתקופה × ${s.advanceRate}%</span><b class="num">${fmt(adv)}</b></div></div><p class="note">שיעור המקדמה נקבע על ידי פקיד השומה. אפשר לעדכן אותו בהגדרות.</p></div>
  </div>

SHELL.settings=()=>{const s=ST(),b=s.business;return `${head('הגדרות','פרטי העסק, מיסוי, מספור ומחירון')}
 <form class="panel" id="setF"><h2>פרטי העסק</h2><div class="grid">
  <label class="f span2">שם העסק<input id="s_name" value="${esc(b.name)}"></label><label class="f">סוג עוסק<select id="s_kind">${['עוסק מורשה','חברה בע״מ','עוסק פטור'].map(k=>`<option ${k===b.kind?'selected':''}>${k}</option>`).join('')}</select></label><label class="f">מספר עוסק / ח.פ<input id="s_tax" value="${esc(b.taxId)}" inputmode="numeric"></label>
  <label class="f span2">כתובת<input id="s_addr" value="${esc(b.address)}"></label><label class="f">טלפון<input id="s_phone" value="${esc(b.phone)}" dir="ltr"></label><label class="f">אימייל<input id="s_email" value="${esc(b.email)}" dir="ltr"></label>
  <label class="f full">פרטי בנק להעברה (יופיעו על החשבונית)<input id="s_bank" value="${esc(b.bank)}" placeholder="בנק, סניף, מספר חשבון"></label></div>
  <h2 style="margin:20px 0 12px">מיסוי ומספור</h2><div class="grid">
  <label class="f">שיעור מע״מ (%)<input type="number" step="0.1" id="s_vat" value="${s.vatRate}"></label><label class="f">תדירות דיווח מע״מ<select id="s_vp"><option value="bi" ${s.vatPeriod==='bi'?'selected':''}>דו־חודשי</option><option value="mon" ${s.vatPeriod==='mon'?'selected':''}>חודשי</option></select></label>
  <label class="f">שיעור מקדמות מס הכנסה (%)<input type="number" step="0.1" id="s_adv" value="${s.advanceRate}"></label><label class="f">סף מספר הקצאה (₪ לפני מע״מ)<input type="number" id="s_alloc" value="${s.allocThreshold}"></label>
  ${Object.keys(DT).map(k=>`<label class="f">מספר ראשון: ${DT[k].name}<input type="number" id="s_num_${k}" value="${s.numbering[k]}"></label>`).join('')}</div>
  <h2 style="margin:20px 0 12px">תמחור הדפסה</h2><div class="grid">
  <label class="f">קליק צבע לגיליון (₪)<input type="number" step="0.01" id="s_cc" value="${s.clicks.color}"></label><label class="f">קליק שחור לגיליון (₪)<input type="number" step="0.01" id="s_cb" value="${s.clicks.bw}"></label>
  <label class="f">תוספת רווח ברירת מחדל (%)<input type="number" id="s_mk" value="${s.markup}"></label><label class="f">מחיר מינימום לעבודה (₪)<input type="number" id="s_min" value="${s.minPrice}"></label>
  <label class="f">בלאי (%)<input type="number" id="s_w" value="${s.waste}"></label><label class="f">גיליונות הכנה לעבודה<input type="number" id="s_su" value="${s.setupSheets}"></label><label class="f">עיגול מחיר ל־(₪)<input type="number" id="s_rt" value="${s.roundTo}"></label>
  <label class="f">שם גיליון<input id="s_shn" value="${esc(s.sheet.name)}"></label><label class="f">רוחב גיליון (מ״מ)<input type="number" id="s_shw" value="${s.sheet.w}"></label><label class="f">גובה גיליון (מ״מ)<input type="number" id="s_shh" value="${s.sheet.h}"></label><label class="f">שוליים לא מודפסים (מ״מ)<input type="number" id="s_shm" value="${s.sheet.margin}"></label><label class="f">גלישה לכל צד (מ״מ)<input type="number" id="s_shb" value="${s.sheet.bleed}"></label></div>
  <h3 style="margin:18px 0 8px">סוגי נייר (מחיר לגיליון)</h3><div class="tbl"><table class="lines"><thead><tr><th>שם</th><th>מחיר לגיליון</th><th></th></tr></thead><tbody id="s_papers">${s.papers.map(p=>`<tr data-id="${esc(p.id)}"><td><input class="pn" value="${esc(p.name)}" aria-label="שם נייר"></td><td style="width:140px"><input class="pp" type="number" step="0.01" value="${p.price}" aria-label="מחיר"></td><td style="width:36px"><button type="button" class="icon" data-act="rmRow" aria-label="הסר">×</button></td></tr>`).join('')}</tbody></table></div><button type="button" class="btn sm ghost" data-act="addPaper" style="margin-top:6px">+ סוג נייר</button>
  <h3 style="margin:18px 0 8px">פעולות גימור</h3><div class="tbl"><table class="lines"><thead><tr><th>שם</th><th>חיוב</th><th>מחיר</th><th>עלות הכנה</th><th></th></tr></thead><tbody id="s_fins">${s.finishings.map(finRow).join('')}</tbody></table></div><button type="button" class="btn sm ghost" data-act="addFin" style="margin-top:6px">+ פעולת גימור</button>
  <div class="mfoot" style="margin-top:18px"><button class="btn pri">שמירת הגדרות</button></div></form>
 <div class="panel"><h2>הנתונים בגיליון</h2><p class="note">כל הנתונים נשמרים בלשוניות של הגיליון: לקוחות, ספקים, עבודות, מסמכים והוצאות. אפשר לעיין ולערוך גם שם, אבל לא לשנות את הכותרות בשורה 1 ולא את עמודת "מזהה". לגיבוי: בגיליון, קובץ ← יצירת עותק.</p><div class="tools">${S.sheetUrl?`<a class="btn" href="${esc(S.sheetUrl)}" target="_blank" rel="noopener">פתיחת הגיליון</a>`:''}<button class="btn" data-act="refresh">רענון נתונים מהגיליון</button></div></div>`};
function finRow(f){f=f||{id:uid(),name:'',unit:'unit',price:0,setup:0};return `<tr data-id="${esc(f.id)}"><td><input class="fn" value="${esc(f.name)}" aria-label="שם"></td><td style="width:130px"><select class="fu" aria-label="חיוב">${Object.entries(UNIT).map(([k,v])=>`<option value="${k}" ${k===f.unit?'selected':''}>${v}</option>`).join('')}</select></td><td style="width:110px"><input class="fp" type="number" step="0.01" value="${f.price}" aria-label="מחיר"></td><td style="width:110px"><input class="fs" type="number" step="1" value="${f.setup||0}" aria-label="עלות הכנה"></td><td style="width:36px"><button type="button" class="icon" data-act="rmRow" aria-label="הסר">×</button></td></tr>`}
function submitSettings(){const g=id=>$('#'+id).value;const s=clone(ST());
  Object.assign(s.business,{name:g('s_name').trim(),kind:g('s_kind'),taxId:g('s_tax').trim(),address:g('s_addr').trim(),phone:g('s_phone').trim(),email:g('s_email').trim(),bank:g('s_bank').trim()});
  s.vatRate=+g('s_vat')||0;s.vatPeriod=g('s_vp');s.advanceRate=+g('s_adv')||0;s.allocThreshold=+g('s_alloc')||0;Object.keys(DT).forEach(k=>s.numbering[k]=+g('s_num_'+k)||1);
  s.clicks={color:+g('s_cc')||0,bw:+g('s_cb')||0};s.markup=+g('s_mk')||0;s.minPrice=+g('s_min')||0;s.waste=+g('s_w')||0;s.setupSheets=+g('s_su')||0;s.roundTo=+g('s_rt')||0;
  s.sheet={name:g('s_shn').trim()||'SRA3',w:+g('s_shw')||320,h:+g('s_shh')||450,margin:+g('s_shm')||0,bleed:+g('s_shb')||0};
  s.papers=$$('#s_papers tr').map(tr=>({id:tr.dataset.id,name:tr.querySelector('.pn').value.trim(),price:+tr.querySelector('.pp').value||0})).filter(p=>p.name);
  s.finishings=$$('#s_fins tr').map(tr=>({id:tr.dataset.id,name:tr.querySelector('.fn').value.trim(),unit:tr.querySelector('.fu').value,price:+tr.querySelector('.fp').value||0,setup:+tr.querySelector('.fs').value||0})).filter(f=>f.name);
  setDirty=false;saveSettings(s);toast('ההגדרות נשמרו')}

/* ---------- events ---------- */
const armed=new WeakSet();
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(el.tagName==='A'&&a!=='docsOpen')return;
  switch(a){
  case 'close':closeModal();DF=null;break;
  case 'newCustomer':custForm();break;
  case 'editCustomer':custForm(S.customers[id]);break;
  case 'custCard':custCard(id);break;
  case 'newSupplier':supForm();break;
  case 'editSupplier':supForm(S.suppliers[id]);break;
  case 'newExpense':expForm();break;
  case 'editExpense':expForm(S.expenses[id]);break;
  case 'payExp':{const x=S.expenses[id];put('expenses',Object.assign({},x,{paid:true,paidDate:today()}));toast('סומן כשולם');break}
  case 'newJob':jobForm();break;
  case 'editJob':jobForm(S.jobs[id]);break;
  case 'billJob':{const j=S.jobs[id];docForm('305',{customerId:j.customerId,jobIds:[j.id],lines:[{desc:j.title+(j.specs?' · '+j.specs:''),qty:1,price:j.price}]});break}
  case 'jfilter':F.jobs.st=el.dataset.v;$$('#jchips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===F.jobs.st));renderBody();break;
  case 'dfilter':F.docs.t=el.dataset.v;$$('[data-act=dfilter]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===F.docs.t));renderBody();break;
  case 'docsOpen':F.docs.open=true;F.docs.t='305';break;
  case 'newDoc':{const t=el.dataset.type;const pre={};if(el.dataset.cust)pre.customerId=el.dataset.cust;if(el.dataset.inv){const inv=S.docs[el.dataset.inv];pre.customerId=inv.customerId;pre.invId=inv.id}closeModal();docForm(t,pre);break}
  case 'creditDoc':{const d=S.docs[id];closeModal();docForm('330',{customerId:d.customerId,refDocId:d.id,lines:clone(d.lines||[]),notes:'ביטול '+DT[d.type].name+' '+d.number});break}
  case 'viewDoc':viewDoc(id);break;
  case 'dlDoc':{const d=S.docs[id];printHTML(DT[d.type].name+' '+d.number,docHTML(d));break}
  case 'copyDoc':{const d=S.docs[id];const t=`${DT[d.type].name} ${d.number}\nתאריך: ${dfmt(d.date)}\nלכבוד: ${d.customerName}\n`+(d.lines||[]).map(l=>`${l.desc} · ${l.qty} × ${fmt(l.price)}`).join('\n')+`\nסה״כ: ${fmt(docTotal(d))}`;copyText(t);break}
  case 'addLine':$('#df_lines').insertAdjacentHTML('beforeend',lineRow());break;
  case 'addPay':$('#df_pays').insertAdjacentHTML('beforeend',payRow());break;
  case 'rmRow':{const tb=el.closest('tbody');el.closest('tr').remove();if(tb&&tb.id==='df_lines'&&!tb.children.length)tb.insertAdjacentHTML('beforeend',lineRow());docRecalc();break}
  case 'addPaper':$('#s_papers').insertAdjacentHTML('beforeend',`<tr data-id="${uid()}"><td><input class="pn" aria-label="שם נייר"></td><td><input class="pp" type="number" step="0.01" value="0" aria-label="מחיר"></td><td><button type="button" class="icon" data-act="rmRow" aria-label="הסר">×</button></td></tr>`);break;
  case 'addFin':$('#s_fins').insertAdjacentHTML('beforeend',finRow());break;
  case 'saveQuote':{readQ();const r=computeQ();if(!Q.customerId){toast('בחר לקוח כדי לשמור הצעה');$('#q_cust').focus();break}
    put('jobs',{id:uid(),number:nextJobNo(),date:today(),customerId:Q.customerId,title:r.title,specs:r.specs,qty:Q.qty,price:r.price,estCost:r2(r.cost),status:'quote',calc:clone(Q)});toast('ההצעה נשמרה בעבודות');go('jobs');break}
  case 'copyQuote':{readQ();const r=computeQ();const b=ST().business;copyText(`הצעת מחיר${b.name?' מ'+b.name:''}\n${r.title}\n${r.specs}\n\nמחיר: ${fmt(r.price)} + מע״מ (${fmt(r.total)} כולל מע״מ)\nמחיר ליחידה: ${fmt(r.unit)}\nההצעה בתוקף ל־14 יום.`);break}
  case 'rkind':{F.reports.kind=el.dataset.v;render();break}
  case 'delete':case 'clearSample':case 'wipe':{
    if(!armed.has(el)){armed.add(el);el.dataset.label=el.textContent;el.textContent='לחץ שוב לאישור';el.classList.add('armed','danger');setTimeout(()=>{if(el.isConnected){armed.delete(el);el.textContent=el.dataset.label;el.classList.remove('armed')}},4000);break}
    if(a==='delete'){del(el.dataset.col,id);closeModal();toast('נמחק')}
    if(a==='clearSample'){COLS.forEach(c=>all(c).filter(x=>x.sample).forEach(x=>del(c,x.id)));toast('נתוני הדוגמה נמחקו')}
    if(a==='wipe'){COLS.forEach(c=>all(c).forEach(x=>del(c,x.id)));toast('כל הנתונים נמחקו')}
    break}
  case 'refresh':refresh(true);break;
  case 'copyta':{const t=$('#cpy');copyText(t.value);break}
  case 'backup':saveFile('גיבוי-כספים-'+today()+'.json',JSON.stringify({version:1,exported:new Date().toISOString(),settings:S.settings,...Object.fromEntries(COLS.map(c=>[c,all(c)]))},null,1));break;
  case 'statement':{const c=S.customers[id];let bal=0;const rows=[['תאריך','מסמך','מספר','חובה','זכות','יתרה']];docs().filter(d=>d.customerId===id).sort((a,b)=>a.date.localeCompare(b.date)).forEach(d=>{let dr=0,cr=0;if(d.type==='305')dr=docTotal(d);if(d.type==='330'||d.type==='400')cr=docTotal(d);if(d.type==='320'){dr=docTotal(d);cr=docTotal(d)}bal+=dr-cr;rows.push([dfmt(d.date),DT[d.type].name,d.number,dr||'',cr||'',r2(bal)])});saveFile('כרטסת '+c.name+'.csv',csv(rows));break}
  case 'csvCustomers':saveFile('לקוחות.csv',csv([['שם','ח.פ','איש קשר','טלפון','אימייל','כתובת','תנאי תשלום','יתרה'],...all('customers').map(c=>[c.name,c.taxId,c.contact,c.phone,c.email,c.address,termName(c.terms),custBalance(c.id)])]));break;
  case 'csvExpenses':saveFile('הוצאות.csv',csv([['תאריך','ספק','קטגוריה','תיאור','אסמכתא','לפני מע״מ','מע״מ','מע״מ לקיזוז','סה״כ','רכוש קבוע','שולם','תאריך תשלום','אמצעי'],...all('expenses').sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{const c=expCalc(e);return[dfmt(e.date),supName(e),catName(e.category),e.desc,e.docNo,c.net,c.vat,c.rec,e.total,e.isAsset?'כן':'',e.paid?'כן':'לא',dfmt(e.paidDate),e.paid?payName(e.method):'']})]));break;
  case 'csvAll':saveFile('מסמכים.csv',csv([['סוג','מספר','תאריך','לקוח','ח.פ לקוח','לפני מע״מ','מע״מ','סה״כ','יתרה פתוחה','מספר הקצאה'],...docs().sort((a,b)=>a.date.localeCompare(b.date)).map(d=>{const s=d.type==='330'?-1:1;return[DT[d.type].name,d.number,dfmt(d.date),d.customerName,d.customerTaxId,d.type==='400'?'':s*docNet(d),d.type==='400'?'':s*docVat(d),s*docTotal(d),d.type==='305'?invOpen(d):'',d.allocation||'']})]));break;
  case 'csvPL':case 'csvVAT':case 'csvCF':case 'csvAging':{const v=$('#vb');const tables=a==='csvPL'||a==='csvVAT'?null:null;const P=F.reports,R=periodRange(P);const inc=income(R.a,R.b),ex=expenses(R.a,R.b);let rows;
    if(a==='csvPL')rows=[['סעיף','סכום'],['הכנסות',inc.net],...Object.entries(ex.by).map(([k,v])=>[catName(k),-r2(v)]),['סה״כ הוצאות',-ex.cost],['רווח',r2(inc.net-ex.cost)]];
    if(a==='csvVAT')rows=[['סעיף','סכום'],['עסקאות חייבות',inc.net],['מע״מ עסקאות',inc.vat],['מע״מ תשומות ציוד',ex.recA],['מע״מ תשומות אחרות',ex.recO],['לתשלום',r2(inc.vat-ex.recA-ex.recO)]];
    if(a==='csvCF'){rows=[['חודש','תקבולים','תשלומים','נטו']];for(let m=0;m<12;m++){const[x,y]=monthRange(P.y,m);const i=cashIn(x,y),o=cashOut(x,y);rows.push([MONTHS[m]+' '+P.y,i,o,r2(i-o)])}}
    if(a==='csvAging'){rows=[['לקוח','חשבונית','תאריך','לתשלום עד','ימי איחור','יתרה']];openInvoices().forEach(d=>rows.push([d.customerName,d.number,dfmt(d.date),dfmt(invDue(d)),Math.max(0,daysBetween(invDue(d),today())),invOpen(d)]))}
    saveFile({csvPL:'רווח והפסד',csvVAT:'דוח מעמ',csvCF:'תזרים',csvAging:'גיול חובות'}[a]+' '+R.label+'.csv',csv(rows));break}
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='jq'){F.jobs.q=t.value;renderBody()}
  if(t.id==='dq'){F.docs.q=t.value;renderBody()}
  if(t.id==='cq'){F.customers.q=t.value;renderBody()}
  if(t.id==='eq'){F.expenses.q=t.value;renderBody()}
  if(t.id==='sq'){F.suppliers.q=t.value;renderBody()}
  if(t.closest('#qf')){readQ();renderQ()}
  if(t.closest('#docF'))docRecalc();
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.chg==='jobStatus'){const j=S.jobs[t.dataset.id];put('jobs',Object.assign({},j,{status:t.value}));toast('הסטטוס עודכן')}
  if(t.id==='dopen'){F.docs.open=t.checked;renderBody()}
  if(t.id==='ef_m'){F.expenses.m=t.value;renderBody()}if(t.id==='ef_c'){F.expenses.cat=t.value;renderBody()}if(t.id==='ef_u'){F.expenses.unpaid=t.checked;renderBody()}
  if(t.id==='r_y'){F.reports.y=+t.value;render()}if(t.id==='r_i'){F.reports.i=+t.value;render()}
  if(t.closest('#qf')){readQ();renderQ()}
  if(t.id==='df_c'){DF.preset.invId=null;docCustChanged()}
  if(t.id==='df_d'&&$('#df_due')){const c=S.customers[$('#df_c').value]||{};$('#df_due').value=dueFrom(t.value,c.terms||0)}
  if(t.dataset.job){const j=S.jobs[t.dataset.job];if(t.checked){const tb=$('#df_lines');const first=tb.querySelector('tr');if(first&&!first.querySelector('.ld').value&&!first.querySelector('.lp').value)first.remove();tb.insertAdjacentHTML('beforeend',lineRow({desc:j.title+(j.specs?' · '+j.specs:''),qty:1,price:j.price}));tb.lastElementChild.dataset.fromJob=j.id}else{const r=$(`#df_lines tr[data-from-job="${CSS.escape(j.id)}"]`);r&&r.remove()}docRecalc()}
  if(t.dataset.ap){const inp=$(`[data-apa="${CSS.escape(t.dataset.ap)}"]`);if(t.checked&&!inp.value){inp.value=invOpen(S.docs[t.dataset.ap])}if(!t.checked)inp.value='';const sum=r2($$('[data-apa]').reduce((s,x)=>s+(+x.value||0),0));const pa=$$('#df_pays .pa');if(pa.length===1)pa[0].value=sum||'';docRecalc()}
  if(t.closest('#docF'))docRecalc();
  if(t.id==='restore'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);let n=0;COLS.forEach(c=>(j[c]||[]).forEach(x=>{if(x&&x.id){put(c,x);n++}}));if(j.settings)saveSettings(j.settings);toast('שוחזרו '+n+' רשומות')}catch(err){toast('קובץ הגיבוי אינו תקין')}};fr.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('submit',e=>{if(e.target.id==='setF'){e.preventDefault();submitSettings()}});

/* view hooks: quote view renders its result after the shell */
let setDirty=false;
const _render=render;render=function(keep){if(!keep)setDirty=false;_render(keep);if(view==='quote')renderQ()};
const _renderBody=renderBody;renderBody=function(){
  if(view==='quote'){const f=$('#qf');if(f&&!f.contains(document.activeElement)){render(true)}return}
  if(view==='settings'){if(!setDirty&&$('#setF'))render(true);return}
  _renderBody()};
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#setF'))setDirty=true});

route();initStore();
</script>
</body></html>
